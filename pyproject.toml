[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zhijiang-agent"
version = "0.1.0"
description = "智讲 Agent：将授权的文本型 PDF 转为一节可溯源教学视频"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "Pillow>=11,<13",
  "imageio-ffmpeg>=0.6,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "reportlab>=4,<5",
]

[tool.setuptools.packages.find]
include = ["zhijiang*"]

[tool.setuptools.package-data]
zhijiang = ["static/*", "powershell/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
