  <path d="M 574 563 H 597" fill="none" stroke="#6EE1CD" stroke-width="3" marker-end="url(#arrow-current)"/>

  <rect x="603" y="529" width="250" height="69" rx="11" fill="#183947" stroke="#58A99F" stroke-width="1.8"/>
  <text x="620" y="558" fill="#F4FAFD" font-family="Arial, sans-serif" font-size="19" font-weight="700">Diagrams &amp; clips</text>
  <text x="620" y="583" fill="#D4E6EB" font-family="Arial, sans-serif" font-size="15">Embedded SVG · segment MP4</text>
  <path d="M 857 563 H 880" fill="none" stroke="#6EE1CD" stroke-width="3" marker-end="url(#arrow-current)"/>

  <rect x="886" y="529" width="250" height="69" rx="11" fill="#183947" stroke="#58A99F" stroke-width="1.8"/>
  <text x="903" y="558" fill="#F4FAFD" font-family="Arial, sans-serif" font-size="19" font-weight="700">Editable PPTX output</text>
  <text x="903" y="583" fill="#D4E6EB" font-family="Arial, sans-serif" font-size="15">Notes · source page refs</text>

  <text x="51" y="654" fill="#A8B8C6" font-family="Arial, sans-serif" font-size="15">Note: PPTX includes editable text, SVG diagrams, and segment clips; dedicated LaTeX / Manim generation remains planned.</text>
