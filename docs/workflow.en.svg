<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Zhijiang Agent: PDF to lesson video and presentation</title>
  <desc id="desc">Implemented workflow: upload an authorized PDF, extract text or run local OCR, select page-numbered source excerpts, then design and validate the lesson. The lesson branches into narrated MP4 video and a PPTX with editable text, speaker notes, embedded SVG teaching diagrams, and per-segment explanatory MP4 clips. Dedicated LaTeX and Manim generation remains planned.</desc>
  <defs>
    <marker id="arrow-current" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#6EE1CD"/>
    </marker>
    <marker id="arrow-planned" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#C6A4FF"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#091723"/>
