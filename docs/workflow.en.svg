  <text x="1066" y="53" fill="#E9DEFF" font-family="Arial, sans-serif" font-size="17">Planned</text>

  <rect x="36" y="118" width="1128" height="315" rx="18" fill="#102A36" stroke="#2C5965" stroke-width="1.5"/>
  <text x="59" y="151" fill="#77E4D1" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1">LESSON GENERATION AND VIDEO · IMPLEMENTED</text>

  <rect x="58" y="174" width="328" height="224" rx="15" fill="#183947" stroke="#58A99F" stroke-width="2"/>
