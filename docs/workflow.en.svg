  <text x="79" y="264" fill="#D4E6EB" font-family="Arial, sans-serif" font-size="19">Rights-confirmed PDF upload</text>
  <text x="79" y="296" fill="#D4E6EB" font-family="Arial, sans-serif" font-size="19">Extract text directly</text>
  <text x="79" y="328" fill="#D4E6EB" font-family="Arial, sans-serif" font-size="19">Local OCR for scanned pages</text>
  <text x="79" y="360" fill="#D4E6EB" font-family="Arial, sans-serif" font-size="19">Keep original page numbers</text>

