  <text x="833" y="317" fill="#D4E6EB" font-family="Arial, sans-serif" font-size="18">FFmpeg audio-video assembly</text>
  <text x="833" y="345" fill="#D4E6EB" font-family="Arial, sans-serif" font-size="18">Export lesson MP4</text>
  <text x="833" y="373" fill="#D4E6EB" font-family="Arial, sans-serif" font-size="18">Show scripts and sources online</text>

  <rect x="36" y="477" width="1128" height="145" rx="18" fill="#102A36" stroke="#2C5965" stroke-width="1.5"/>
  <path d="M 599 399 V 454 H 445 V 527" fill="none" stroke="#6EE1CD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-current)"/>
  <text x="59" y="512" fill="#77E4D1" font-family="Arial, sans-serif" font-size="18" font-weight="700">PPTX EXPORT · IMPLEMENTED</text>
