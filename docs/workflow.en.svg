  <text x="56" y="85" fill="#ADC2CD" font-family="Arial, sans-serif" font-size="16">Source-grounded teaching design, diagrams, animation, and narration</text>

  <line x1="844" y1="47" x2="887" y2="47" stroke="#6EE1CD" stroke-width="3" marker-end="url(#arrow-current)"/>
  <text x="897" y="53" fill="#D9EEE8" font-family="Arial, sans-serif" font-size="17">Implemented</text>
